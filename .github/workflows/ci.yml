name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Keep this image version equal to the exact @playwright/test dependency.
    # It supplies the browser builds and OS/font libraries used by Linux baselines.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    env:
      CI: 'true'
      FOLDMARK_CONSUMER_BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - name: Installed tarball consumer (SSR, types, production browsers)
        run: node scripts/test-consumer.mjs
      - name: Chromium, Firefox, WebKit workflows and visual regressions
        run: npm run test:browser
      - run: npm run format:check
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
