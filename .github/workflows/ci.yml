name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Keep this image version equal to the exact @playwright/test dependency.
    # It supplies the browser builds and OS/font libraries used by Linux baselines.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    env:
      CI: "true"
      FOLDMARK_CONSUMER_BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
      # mise.toml pins Bun and Node; its postinstall hook runs `bun install --frozen-lockfile`.
      - run: mise trust && mise install
      - run: mise run typecheck
      - run: mise run lint
      - run: mise run test
      - run: mise run build
      - run: mise run build:demo
      - name: Installed tarball consumer (SSR, types, production browsers)
        run: mise run test:consumer
      - name: Chromium, Firefox, WebKit workflows and visual regressions
        run: mise run test:browser
      - run: mise run format:check
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
